# YOLO12 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo12
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo12n.yaml' will call yolo12.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] 
  s: [0.50, 0.50, 1024] 
  m: [0.50, 1.00, 512] 
  l: [1.00, 1.00, 512] 
  x: [1.00, 1.50, 512] 

# backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, BAA2C2f, [512, True, 4]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, BAA2C2f, [1024, True, 1]] # 8

# head
head:
  - [[4,6, 8], 1, CSDC, ["true","down"]] #9
  - [[-1,8], 1, GateAdd, [False,False]] #10
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] 
  - [[4, 8,6], 1, CSDC, ["False","mix"]]
  - [[-1,6], 1, GateAdd, [False,False]] #13
  - [[-1, 11], 1, Concat, [1]] # cat backbone P4  
  - [-1, 2, BAA2C2f, [512, False, -1]] # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[6, 8,4], 1, CSDC, ["False","up"]]
  - [[4,-1], 1, GateAdd, [False,False]] #18
  - [[-1, 16], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, BAA2C2f, [256, False, -1]] # 20  256
  - [[-1,17], 1, GateAdd, [True,True]] #21  OUT1

  - [-1, 1, Conv, [256, 3, 2]] #22
  - [[15,12], 1, GateAdd, [False,True]]  #???
  - [[-1, 22], 1, Concat, [1]] # cat head P4
  - [-1, 2, BAA2C2f, [512, False, -1]] # 25
  - [[-1,12], 1, GateAdd, [False,True]] #26  OUT2
  - [25, 1, Conv, [512, 3, 2]]
  
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32-large)
  - [[-1,9], 1, GateAdd, [False,True]] #29
  - [[21, 26, 29], 1, Detect, [nc]] # Detect(P3, P4, P5)
